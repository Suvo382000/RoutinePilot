<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#grad)"/>
  <!-- Calendar body -->
  <rect x="10" y="16" width="44" height="36" rx="5" fill="white" fill-opacity="0.15"/>
  <rect x="10" y="16" width="44" height="36" rx="5" stroke="white" stroke-width="2.5" fill="none"/>
  <!-- Calendar header bar -->
  <rect x="10" y="16" width="44" height="12" rx="5" fill="white" fill-opacity="0.25"/>
  <rect x="10" y="22" width="44" height="6" fill="white" fill-opacity="0.25"/>
  <!-- Hanger pins -->
  <rect x="21" y="10" width="4" height="10" rx="2" fill="white"/>
  <rect x="39" y="10" width="4" height="10" rx="2" fill="white"/>
  <!-- Grid dots (schedule slots) -->
  <rect x="16" y="34" width="8" height="5" rx="1.5" fill="white" fill-opacity="0.9"/>
  <rect x="28" y="34" width="8" height="5" rx="1.5" fill="#a78bfa" fill-opacity="0.95"/>
  <rect x="40" y="34" width="8" height="5" rx="1.5" fill="white" fill-opacity="0.9"/>
  <rect x="16" y="43" width="8" height="5" rx="1.5" fill="white" fill-opacity="0.9"/>
  <rect x="28" y="43" width="8" height="5" rx="1.5" fill="white" fill-opacity="0.9"/>
  <rect x="40" y="43" width="8" height="5" rx="1.5" fill="#38bdf8" fill-opacity="0.95"/>
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
</svg>
